services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Sin GPU en contenedor típico
      PORT: "8000"
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      CHROMA_PERSIST_DIR: storage/chroma
      HF_HOME: /app/.cache/huggingface
      RUN_INGEST_ON_START: ${RUN_INGEST_ON_START:-false}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
    volumes:
      - ./storage/chroma:/app/storage/chroma
      - ./Documentos:/app/Documentos:ro
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - chatbot_net

  # Placeholder para base de datos futura (descomentar cuando se integre)
